name: P0-04 historical edge-case evidence inventory
on:
  push:
    branches: [feature/p0-04-edge-evidence]
permissions:
  contents: read
  actions: read
jobs:
  triage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s audit -p 'test_edge_case_inventory.py' -v
      - uses: actions/download-artifact@v4
        with:
          run-id: 45305366242
          github-token: ${{ github.token }}
          name: p0-03-historical-card-evidence
          path: results/ledger
      - uses: actions/download-artifact@v4
        with:
          run-id: 45454720801
          github-token: ${{ github.token }}
          name: format-aware-prior-qa
          path: results/qa
      - run: python3 audit/edge_case_inventory.py --ledger results/ledger/card_evidence.json --xml results/qa/all_tests.xml --output results/edge_cases.json
      - uses: actions/upload-artifact@v4
        with:
          name: p0-04-edge-evidence
          path: results/edge_cases.json
