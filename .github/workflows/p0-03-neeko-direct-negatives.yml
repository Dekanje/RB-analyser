name: P0-03 native Neeko negative registration controls
on:
  push:
    branches: [feature/p0-03-neeko-direct-negatives]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime libraries only
        run: |
          sudo apt-get install -y -qq --no-install-recommends libboost-context1.83.0 libboost-program-options1.83.0
      - uses: actions/download-artifact@v4
        with:
          run-id: 45418796610
          github-token: ${{ github.token }}
          name: neeko-guarded-candidate-binary
          path: engine_build
      - uses: actions/download-artifact@v4
        with:
          run-id: 45181493632
          github-token: ${{ github.token }}
          name: expanded-optimized-58-independent-radiance-bo3
          path: results/selected
      - run: |
          chmod +x engine_build/riftbound
          python3 scripts/check_neeko_native_negatives.py
      - uses: actions/upload-artifact@v4
        with:
          name: neeko-native-negative-receipt
          path: results/neeko_native_negatives.json
