name: Competitive broader multi-slot 407 sideboard policies for Worlds trio (one-shot)
on:
  push:
    branches: ['research/competitive-agent-benchmark-v1-2026-11-23']
    paths: ['.github/workflows/competitive-worlds-sideboard-depth3.yml']
permissions:
  contents: read
  actions: read
jobs:
  validate-multi-slot-legality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prove distinct side/main card selection and 1-3-swap Constructed legality
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/sideboard_policy_search.py scripts/test_sideboard_policy_search.py
          python3 -m unittest discover -s scripts -p 'test_sideboard_policy_search.py' -v
  real-bo3-multi-swap-search:
    needs: validate-multi-slot-legality
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: draven-vs-miss-fortune
            legend: 'Draven, Glorious Executioner'
            opponent: 'Miss Fortune, Bounty Hunter'
          - id: leblanc-vs-reksai
            legend: 'LeBlanc, Deceiver'
            opponent: "Rek'Sai, Void Burrower"
          - id: masteryi-vs-ambessa
            legend: 'Master Yi, Wuju Bladesman'
            opponent: 'Ambessa, Matriarch of War'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 45244227502
          github-token: ${{ github.token }}
          name: competitive-rule407-verified-engine-binary
          path: engine_build
      - uses: actions/download-artifact@v4
        with:
          run-id: 45181493632
          github-token: ${{ github.token }}
          name: expanded-optimized-58-independent-radiance-bo3
          path: results/selected
      - name: Install pinned AlphaRune C++ runtime
        timeout-minutes: 12
        run: |
          set -euo pipefail
          if ! sudo env DEBIAN_FRONTEND=noninteractive timeout -k 10s 55s apt-get -o Acquire::Retries=0 update -qq; then
            echo '::warning::using cached package indexes'
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout 360s apt-get -o Acquire::Retries=2 install -y -qq --no-install-recommends libboost-program-options1.83.0 libboost-filesystem1.83.0 libboost-system1.83.0 libboost-context1.83.0
          chmod +x engine_build/riftbound
          if ldd engine_build/riftbound | grep -q 'not found'; then exit 1; fi
      - name: Compare distinct and combined three-slot legal sideboard strategies against frozen baseline
        timeout-minutes: 60
        run: |
          python3 -u scripts/sideboard_policy_search.py \
            --selected results/selected \
            --engine engine_build/riftbound \
            --registry engine_build/registry.json \
            --output results/worlds_sideboard_policy/${{ matrix.id }} \
            --legend "${{ matrix.legend }}" \
            --opponent "${{ matrix.opponent }}" \
            --max-tech-options 3 --max-swap-depth 3 \
            --repetitions 2 --agent ismcts:sims=24 --timeout 200 \
            --seed 202611241100
      - name: Reject unverified 407 games, and never adopt an unconfirmed policy
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path('results/worlds_sideboard_policy') / os.environ['MATRIX_ID'] / 'sideboard_policy_screen.json').read_text())
          assert d['status']=='SINGLE_MATCHUP_STRATEGIC_BO3_POLICY_SCREEN_ONLY'
          assert d['baseline_completed_series']==4
          assert d['candidate_completed_series']==4*d['search_candidates']
          assert d['loser_chooses_first_verified'] is True
          assert d['any_deck_changes_adopted'] is False
          assert d['search_candidates']>=4
          assert all(len(x['cases'])==4 for x in d['candidate_results'])
          print('MULTISWAP_BO3_SCREEN_PASS',d['legend'],d['opponent'],d['search_candidates'])
          PY
        env:
          MATRIX_ID: ${{ matrix.id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competitive-worlds-sideboard-${{ matrix.id }}
          path: results/worlds_sideboard_policy/${{ matrix.id }}/
          retention-days: 30
          if-no-files-found: warn
