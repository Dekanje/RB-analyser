name: Baseline upstream C++ regression control (no Radiance overlay)
on:
  push:
    branches: ['radiance/engine-mechanics-development']
    paths: ['.github/workflows/alpharune-baseline-control.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Obtain untouched pinned engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ ccache libboost-all-dev nlohmann-json3-dev
          git clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: alpharune-baseline-control-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            radiance-ccache-ubuntu2404-
      - name: Build untouched 955-definition test engine
        run: |
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build alpharune/build --target riftbound_tests -j 2
      - name: Reproduce same five tests on untouched upstream source
        run: |
          mkdir -p results
          RIFTBOUND_ROOT=alpharune alpharune/build/riftbound_tests \
            --gtest_filter='PerfEngineDeathBatch.EveryCardBatchSaysWhoDies:RandomPlayerAgent.GamesOfForcedPlayEndAndRepeat:HiddenOrderLeak.TheSameGameUnderOtherObjectIdsLooksTheSameToBothPlayers:DeckFuzz.DeckOfSeedOneIsPinned:SweepCostsTest.Removal_NoRegisteredTriggerWithNothingToDecideIsFinalizedForNothing' \
            --gtest_output=xml:results/upstream_regression_control.xml
      - name: Save control results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-five-test-control
          path: results/upstream_regression_control.xml
          retention-days: 14
          if-no-files-found: ignore
