name: P0-03 cached Neeko agent noninterference
on:
  push:
    branches: [feature/p0-03-neeko-agent-noninterference]
permissions:
  contents: read
  actions: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s scripts -p 'test_neeko_agent_noninterference.py' -v
      - name: Install runtime libraries only
        run: sudo apt-get install -y -qq --no-install-recommends libboost-context1.83.0 libboost-program-options1.83.0
      - uses: actions/download-artifact@v4
        with:
          run-id: 45424993677
          github-token: ${{ github.token }}
          name: neeko-privacy-candidate-binary
          path: engine_build
      - uses: actions/download-artifact@v4
        with:
          run-id: 45181493632
          github-token: ${{ github.token }}
          name: expanded-optimized-58-independent-radiance-bo3
          path: results/selected
      - name: Native paired trace screen
        run: |
          chmod +x engine_build/riftbound
          python3 scripts/check_neeko_agent_noninterference.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neeko-agent-noninterference-v2
          path: results/neeko_agent_noninterference_v2.json
