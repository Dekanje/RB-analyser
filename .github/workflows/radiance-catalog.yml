name: Radiance gallery import and gameplay coverage audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radiance-catalog.yml'
      - 'radiance/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Pin community normalization of official Riot gallery
        run: |
          git clone --quiet https://github.com/Dystorted888/riftbound-card-data.git gallery-data
          git -C gallery-data checkout --quiet --detach 8a10812968506363a373f36a8bb7cf4d94d02694
      - name: Install dependencies and checkout AlphaRune snapshot
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ libboost-all-dev nlohmann-json3-dev
          git clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
      - name: Restore cached engine
        id: cache
        uses: actions/cache@v4
        with:
          path: alpharune/build/riftbound
          key: alpharune-ubuntu2404-ec90f0f-release-v1
      - name: Compile engine if cache absent
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFTBOUND_BUILD_JOBS=2
          cmake --build alpharune/build --target riftbound -j 2
      - name: Export actual compiled engine registry
        run: |
          mkdir -p radiance_reports
          alpharune/build/riftbound --dump-registry radiance_reports/compiled_engine_registry.json
      - name: Import all Radiance printings with explicit implementation gate
        run: |
          python3 radiance/import_radiance.py --cards-json gallery-data/data/cards.json --registry-json radiance_reports/compiled_engine_registry.json --output radiance_reports --require-complete-numbered
      - name: Commit normalized Radiance metadata to RB-analyser
        run: |
          python3 radiance/promote_catalog.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radiance/data/radiance_catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Import official-gallery Radiance catalog metadata (effects unverified)'
            git push origin HEAD:main
          fi
      - name: Upload metadata and missing-mechanics manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiance-complete-card-catalog-and-mechanics-coverage
          path: radiance_reports/
          retention-days: 14
          if-no-files-found: warn
