name: Refresh current Radiance gallery and recheck engine support

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radiance-live-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin and refresh Riot gallery reader
        run: |
          git clone --quiet https://github.com/Dystorted888/riftbound-card-data.git gallery-data
          git -C gallery-data checkout --quiet --detach 8a10812968506363a373f36a8bb7cf4d94d02694
          cd gallery-data
          npm test
          npm run refresh
      - name: Check out pinned AlphaRune engine for true card coverage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ libboost-all-dev nlohmann-json3-dev
          git clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
      - name: Restore compiled engine
        id: cache
        uses: actions/cache@v4
        with:
          path: alpharune/build/riftbound
          key: alpharune-ubuntu2404-ec90f0f-release-v1
      - name: Compile if necessary
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFTBOUND_BUILD_JOBS=2
          cmake --build alpharune/build --target riftbound -j 2
      - name: Export actual engine registry
        run: |
          mkdir -p radiance_reports
          alpharune/build/riftbound --dump-registry radiance_reports/compiled_engine_registry.json
      - name: Import refreshed Riot-gallery printings
        run: |
          python3 radiance/import_radiance.py --cards-json gallery-data/data/cards.json --registry-json radiance_reports/compiled_engine_registry.json --output radiance_reports --require-complete-numbered
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path("radiance_reports/summary.json")
          s=json.loads(p.read_text())
          s["radiance_source"]="Live Riot public card gallery refreshed via pinned MIT-licensed Dystorted888 gallery client"
          s["source_snapshot_commit"]="RIOT_LIVE_REFRESH_with_client_8a10812968506363a373f36a8bb7cf4d94d02694"
          p.write_text(json.dumps(s,ensure_ascii=False,indent=2)+"\n")
          PY
      - name: Commit complete verified Radiance catalog metadata
        run: |
          python3 radiance/promote_catalog.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add radiance/data/radiance_catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh complete Riot Radiance gallery metadata (mechanics remain unverified)'
            git push origin HEAD:main
          fi
      - name: Preserve current source coverage and complete audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiance-live-current-catalog-audit
          path: radiance_reports/
          retention-days: 14
          if-no-files-found: warn
