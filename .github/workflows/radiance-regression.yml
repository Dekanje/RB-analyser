name: Pinned AlphaRune regression suite with Radiance overlay
on:
  push:
    branches: ['radiance/engine-mechanics-development']
    paths:
      - 'radiance/validation/regression-requests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ ccache libboost-all-dev nlohmann-json3-dev
          git clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
          python3 radiance/engine_overlay/apply.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: radiance-regression-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: radiance-ccache-ubuntu2404-
      - name: Compile full upstream test suite against changed engine
        run: |
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFTBOUND_BUILD_JOBS=2 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build alpharune/build --target riftbound_tests -j 2
      - name: Execute compiled engine regression suite
        run: |
          mkdir -p results
          RIFTBOUND_ROOT=alpharune alpharune/build/riftbound_tests --gtest_brief=1 --gtest_output=xml:results/radiance_regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiance-regression-results
          path: results/radiance_regression.xml
          retention-days: 30
          if-no-files-found: ignore
