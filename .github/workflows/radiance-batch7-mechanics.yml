name: Radiance Batch 7 - mechanics-based C++ implementation
on:
  push:
    branches: ['radiance/mechanics-batch7-2026-11-22']
    paths:
      - '.github/workflows/radiance-batch7-mechanics.yml'
      - 'radiance/engine_overlay/**'
      - 'radiance/verify_batch7_registry.py'
      - 'radiance/coverage_ledger.py'
      - 'radiance/audit_wave5_catalog_registry.py'
  workflow_dispatch:
concurrency:
  group: radiance-batch7-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fast source and catalog audit sanity
        run: |
          python3 -m py_compile radiance/engine_overlay/apply.py radiance/engine_overlay/apply_wave2.py radiance/engine_overlay/apply_wave3.py radiance/engine_overlay/apply_wave4.py radiance/engine_overlay/apply_batch6.py radiance/engine_overlay/apply_batch7.py radiance/verify_batch7_registry.py radiance/coverage_ledger.py radiance/audit_wave5_catalog_registry.py
          python3 -m unittest discover -s radiance -p 'test_wave5_catalog_audit.py' -v
          grep -F 'range(1001,1008)' radiance/engine_overlay/apply_batch7.py
          test -f radiance/engine_overlay/source/cards/units/1001_radiance_batch7_supported_effects.cpp
          test -f radiance/engine_overlay/source/tests/cards/test_radiance_batch7.cpp
  compiled-card-check:
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[check-cards]') || startsWith(github.event.head_commit.message, '[batch-ready]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v4
      - name: Install required C++ libraries and apply pinned engine overlay
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ ccache libboost-all-dev nlohmann-json3-dev
          git clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
          python3 radiance/engine_overlay/apply.py
          python3 radiance/engine_overlay/wave1_regression_fix.py
          python3 radiance/engine_overlay/apply_wave2.py
          python3 radiance/engine_overlay/apply_wave3.py
          python3 radiance/engine_overlay/apply_wave4.py
          python3 radiance/engine_overlay/apply_batch6.py
          python3 radiance/engine_overlay/apply_batch7.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: rad7-ec90f0f-ubuntu-gcc13-release-${{ github.sha }}
          restore-keys: |
            rad6-ec90f0f-ubuntu-gcc13-release-
            radiance-alpharune-ec90f0f-gcc13-release-v1-
            radiance-wave5-audit-
            radiance-wave4-ccache-
      - name: Compile actual AlphaRune engine with Batch 7 cards
        run: |
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFTBOUND_BUILD_JOBS=2 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build alpharune/build --target riftbound riftbound_tests -j 2
      - name: Run all dedicated Radiance mechanics tests through engine paths
        run: |
          mkdir -p results
          RIFTBOUND_ROOT=alpharune alpharune/build/riftbound_tests --gtest_filter='RadianceWave1Test.*:RadianceWave2Test.*:RadianceWave3Test.*:RadianceWave4Test.*:RadianceBatch6Test.*:RadianceBatch7Test.*' --gtest_brief=1 --gtest_output=xml:results/radiance_batch7_focused_tests.xml
      - name: Full regression gate - only on batch ready
        if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, '[batch-ready]') }}
        run: |
          RIFTBOUND_ROOT=alpharune alpharune/build/riftbound_tests --gtest_brief=1 --gtest_output=xml:results/radiance_batch7_full_regression.xml
      - name: Strict compiled registration and catalog audit
        run: |
          mkdir -p results
          alpharune/build/riftbound --dump-registry results/radiance_batch7_registry.json
          python3 radiance/verify_batch7_registry.py results/radiance_batch7_registry.json --output results/radiance_batch7_coverage.json
          python3 radiance/audit_wave5_catalog_registry.py radiance/data/radiance_catalog.json results/radiance_batch7_registry.json > results/radiance_batch7_catalog_audit.json
          python3 radiance/coverage_ledger.py results/radiance_batch7_registry.json --output results/radiance_batch7_ledger.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("results/radiance_batch7_catalog_audit.json").read_text())
          assert x["compiled_registry_size"]==1007
          assert x["registered_base_count"]==51
          assert x["missing_base_count"]==116
          assert x["all_mechanics_verified"] is False
          print("BATCH7_CATALOG_GATE_PASS_NOT_FULL_MECHANICS_CERTIFICATION")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiance-batch7-1007-card-registry-and-tests
          path: results/
          retention-days: 30
          if-no-files-found: ignore
