name: Validate all 58 original Riftbound decks with the actual C++ engine
on:
  push:
    branches: ['radiance/engine-mechanics-development']
    paths:
      - 'radiance/validation/requests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radiance-original-58-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-original-58:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ ccache libboost-all-dev nlohmann-json3-dev
      - name: Checkout original pinned AlphaRune
        run: |
          git clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
      - name: Apply experimental Radiance engine overlay
        run: python3 radiance/engine_overlay/apply.py
      - name: Reuse compilation cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: radiance-original-58-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            radiance-original-58-ccache-
            radiance-ccache-ubuntu2404-
      - name: Compile real engine
        run: |
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFTBOUND_BUILD_JOBS=2 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build alpharune/build --target riftbound -j 2
      - name: Confirm original Radiance smoke games
        run: python3 radiance/engine_overlay/verify.py
      - name: Validate every original deck without substitutions in both seats
        run: |
          python3 scripts/validate_58_originals.py \
            --engine alpharune/build/riftbound \
            --repetitions 2 --seconds 50 \
            --output results/all_58_engine_validation.json
      - name: Upload detailed validation receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-58-original-deck-validation
          path: |
            results/all_58_engine_validation.json
            results/manifest.json
            radiance/engine_overlay/compiled_registry.json
          retention-days: 30
          if-no-files-found: ignore
