name: Validate 10 AlphaRune-compatible deck variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alpharune-compatibility.yml'
      - 'compat/**'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify-49:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ libboost-all-dev nlohmann-json3-dev
      - name: Retrieve AlphaRune exact commit
        run: |
          git clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
      - name: Restore compiled engine
        id: cache
        uses: actions/cache@v4
        with:
          path: alpharune/build/riftbound
          key: alpharune-ubuntu2404-ec90f0f-release-v1
      - name: Build if needed
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFTBOUND_BUILD_JOBS=2
          cmake --build alpharune/build --target riftbound -j 2
      - name: Validate all 58 original or patched candidate decks
        run: python3 compat/verify_patched.py
      - name: Upload engine-candidate audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpharune-compatibility-validation
          path: compat_results/
          retention-days: 14
          if-no-files-found: warn
