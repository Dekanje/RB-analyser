name: Repair full-field BO3 card legality and Mordekaiser fiber crashes
on:
  push:
    branches: ['repair/bo3-fullfield-card-legality-2026-11-23']
    paths:
      - '.github/workflows/repair-fullfield-engine-replay.yml'
      - 'radiance/engine_overlay/fullfield_repair.py'
      - 'radiance/engine_overlay/stability_patch.py'
      - 'scripts/replay_fullfield_failures.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: repaired-fullfield-card-legality-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile-repair-and-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Validate repair scripts before consuming runner resources
        run: |
          set -euo pipefail
          python3 -m py_compile radiance/engine_overlay/stability_patch.py radiance/engine_overlay/fullfield_repair.py scripts/replay_fullfield_failures.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path('radiance/engine_overlay')
          assert 'n == "One-Two Punch"' in (root/'stability_patch.py').read_text()
          assert 'Convergent Mutation' in (root/'stability_patch.py').read_text()
          assert '__final64_showoff' in (root/'fullfield_repair.py').read_text()
          assert 'boost::context::detail::forced_unwind' in (root/'stability_patch.py').read_text()
          print('SOURCE_REPAIR_INVARIANTS_PASS')
          PY
      - name: Install pinned AlphaRune build requirements
        timeout-minutes: 13
        run: |
          set -euo pipefail
          if ! sudo env DEBIAN_FRONTEND=noninteractive timeout -k 10s 65s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update -qq; then
            echo "::warning::apt update failed; using cached package indexes"
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout 420s apt-get -o DPkg::Lock::Timeout=30 -o Acquire::Retries=2 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25 install -y -qq --no-install-recommends ccache libboost-program-options-dev libboost-filesystem-dev libboost-system-dev libboost-context-dev nlohmann-json3-dev
          timeout 120s git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
      - name: Apply ALL 167 Radiance definitions, exact card rules repair and ISMCTS stability patch
        run: |
          set -euo pipefail
          python3 radiance/engine_overlay/apply.py
          python3 radiance/engine_overlay/wave1_regression_fix.py
          python3 radiance/engine_overlay/apply_wave2.py
          python3 radiance/engine_overlay/apply_wave3.py
          python3 radiance/engine_overlay/apply_wave4.py
          python3 radiance/engine_overlay/apply_batch6.py
          python3 radiance/engine_overlay/apply_batch7.py
          python3 radiance/engine_overlay/apply_batch8.py
          python3 radiance/engine_overlay/apply_batch9.py
          python3 radiance/engine_overlay/apply_batch9_battlefields.py
          python3 radiance/engine_overlay/apply_batch9_disarm_chain.py
          python3 radiance/engine_overlay/apply_batch10.py
          python3 radiance/engine_overlay/apply_final64.py
          python3 radiance/engine_overlay/stability_patch.py
          python3 radiance/engine_overlay/fullfield_repair.py
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: repair-fullfield-1123-pch-gcc13-${{ github.sha }}
          restore-keys: |
            rad64-pch-safe-linux-gcc13-
      - name: Compile repaired 1123-card engine and validate all 167 Radiance identities
        timeout-minutes: 40
        run: |
          set -euo pipefail
          ccache -M 3G
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFTBOUND_BUILD_JOBS=3 "-DCMAKE_CXX_COMPILER_LAUNCHER=env;CCACHE_SLOPPINESS=pch_defines,time_macros;$(pwd)/alpharune/scripts/ccache_pch_safe.sh"
          cmake --build alpharune/build --target riftbound -j 3
          mkdir -p engine_build
          cp alpharune/build/riftbound engine_build/riftbound
          engine_build/riftbound --dump-registry engine_build/registry.json
          python3 radiance/verify_final64_registry.py engine_build/registry.json
      - name: Fetch exactly the successful 58-deck search outputs (unchanged SHA)
        uses: actions/download-artifact@v4
        with:
          run-id: 45181493632
          github-token: ${{ github.token }}
          name: expanded-optimized-58-independent-radiance-bo3
          path: results/selected
      - name: Replay exact previously failing game seeds with repaired engine, not synthetic mocks
        timeout-minutes: 17
        run: |
          set -euo pipefail
          python3 -u scripts/replay_fullfield_failures.py \
            --selected results/selected/selected_decks \
            --engine engine_build/riftbound \
            --output results/repaired_replays \
            --agent ismcts:sims=24 --timeout 85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-fullfield-exact-seed-evidence
          path: results/repaired_replays/
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-fullfield-engine-1123
          path: |
            engine_build/riftbound
            engine_build/registry.json
          retention-days: 14
