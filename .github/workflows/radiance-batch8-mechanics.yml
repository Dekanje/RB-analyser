name: Radiance Batch 8 - mechanics-based C++ implementation
on:
  push:
    branches: ['radiance/mechanics-batch8-2026-11-22']
    paths:
      - '.github/workflows/radiance-batch8-mechanics.yml'
      - 'radiance/engine_overlay/**'
      - 'radiance/verify_batch8_registry.py'
      - 'radiance/coverage_ledger.py'
      - 'radiance/audit_wave5_catalog_registry.py'
  workflow_dispatch:
    inputs:
      validation_level:
        description: 'Select fast targeted test, batch audit, or final full regression'
        type: choice
        required: true
        default: targeted
        options:
          - targeted
          - batch
          - full
      gtest_filter:
        description: 'GoogleTest name/filter for targeted mode only'
        type: string
        required: false
        default: 'RadianceBatch8Test.*'
concurrency:
  group: radiance-batch8-staged-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      gtest_filter: ${{ steps.scope.outputs.gtest_filter }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the minimum required validation scope
        id: scope
        env:
          EVENT_KIND: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          INPUT_LEVEL: ${{ inputs.validation_level }}
          INPUT_FILTER: ${{ inputs.gtest_filter }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          event = os.environ.get("EVENT_KIND", "")
          message = os.environ.get("COMMIT_MESSAGE", "").splitlines()
          subject = message[0].strip() if message else ""
          if event == "workflow_dispatch":
              mode = os.environ.get("INPUT_LEVEL") or "targeted"
              test_filter = os.environ.get("INPUT_FILTER") or "RadianceBatch8Test.*"
              if mode not in ("targeted", "batch", "full"):
                  raise ValueError("Invalid dispatch validation level")
          elif subject.startswith("[batch-ready]"):
              mode, test_filter = "full", ""
          elif subject.startswith("[check-cards]"):
              mode, test_filter = "batch", ""
          elif subject.startswith("[test-fix"):
              match = re.match(r"^\[test-fix(?::([A-Za-z0-9_.*?:/-]{1,200}))?\](?:\s|$)", subject)
              if not match:
                  raise ValueError("Invalid [test-fix:GoogleTest.Filter] commit prefix")
              mode, test_filter = "targeted", match.group(1) or "RadianceBatch8Test.*"
          else:
              mode, test_filter = "preflight", ""
          if mode == "targeted" and not re.fullmatch(r"[A-Za-z0-9_.*?:/-]{1,200}", test_filter):
              raise ValueError("Unsafe targeted GoogleTest filter")
          print("mode=" + mode)
          print("gtest_filter=" + (test_filter if mode == "targeted" else ""))
          PY
      - name: Fast source and catalog audit sanity
        run: |
          python3 -m py_compile radiance/engine_overlay/apply.py radiance/engine_overlay/apply_wave2.py radiance/engine_overlay/apply_wave3.py radiance/engine_overlay/apply_wave4.py radiance/engine_overlay/apply_batch6.py radiance/engine_overlay/apply_batch7.py radiance/engine_overlay/apply_batch8.py radiance/verify_batch8_registry.py radiance/coverage_ledger.py radiance/audit_wave5_catalog_registry.py
          python3 -m unittest discover -s radiance -p 'test_wave5_catalog_audit.py' -v
          grep -F 'range(1010,1016)' radiance/engine_overlay/apply_batch8.py
          test -f radiance/engine_overlay/source/cards/units/1010_radiance_batch8.cpp
          test -f radiance/engine_overlay/source/tests/cards/test_radiance_batch8.cpp
  compiled-card-check:
    needs: preflight
    if: ${{ needs.preflight.outputs.mode != 'preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 59
    env:
      VALIDATION_MODE: ${{ needs.preflight.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Install required C++ libraries and apply pinned engine overlay
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ ccache libboost-all-dev nlohmann-json3-dev
          git clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
          python3 radiance/engine_overlay/apply.py
          python3 radiance/engine_overlay/wave1_regression_fix.py
          python3 radiance/engine_overlay/apply_wave2.py
          python3 radiance/engine_overlay/apply_wave3.py
          python3 radiance/engine_overlay/apply_wave4.py
          python3 radiance/engine_overlay/apply_batch6.py
          python3 radiance/engine_overlay/apply_batch7.py
          python3 radiance/engine_overlay/apply_batch8.py
      - name: Restore and save C++ compiler cache (also on failed tests)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: rad8-staged-ec90f0f-ubuntu-gcc13-release-${{ github.sha }}
          save-always: true
          restore-keys: |
            rad8-staged-ec90f0f-ubuntu-gcc13-release-
            rad8-ec90f0f-ubuntu-gcc13-release-
            rad6-ec90f0f-ubuntu-gcc13-release-
            radiance-alpharune-ec90f0f-gcc13-release-v1-
            radiance-wave5-audit-
            radiance-wave4-ccache-
      - name: Compile actual AlphaRune engine with Batch 8 cards
        run: |
          ccache -M 1G
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFTBOUND_BUILD_JOBS=2 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          if [ "$VALIDATION_MODE" = targeted ]; then
            cmake --build alpharune/build --target riftbound_tests -j 2
          else
            cmake --build alpharune/build --target riftbound riftbound_tests -j 2
          fi
          ccache -s
      - name: Targeted test - only the failing GoogleTest cases
        if: ${{ needs.preflight.outputs.mode == 'targeted' }}
        env:
          GTEST_FILTER: ${{ needs.preflight.outputs.gtest_filter }}
        run: |
          mkdir -p results
          RIFTBOUND_ROOT=alpharune alpharune/build/riftbound_tests --gtest_list_tests --gtest_filter="$GTEST_FILTER" > results/targeted_list.txt
          python3 - <<'PY'
          from pathlib import Path
          lines = Path("results/targeted_list.txt").read_text().splitlines()
          assert any(line.startswith("  ") and not line.lstrip().startswith("#") for line in lines), "No tests matched the requested filter"
          PY
          RIFTBOUND_ROOT=alpharune alpharune/build/riftbound_tests --gtest_filter="$GTEST_FILTER" --gtest_brief=1 --gtest_output=xml:results/radiance_targeted_tests.xml
      - name: Focused Radiance mechanics tests - batch and full modes
        if: ${{ needs.preflight.outputs.mode == 'batch' || needs.preflight.outputs.mode == 'full' }}
        run: |
          mkdir -p results
          RIFTBOUND_ROOT=alpharune alpharune/build/riftbound_tests --gtest_filter='RadianceWave1Test.*:RadianceWave2Test.*:RadianceWave3Test.*:RadianceWave4Test.*:RadianceBatch6Test.*:RadianceBatch7Test.*:RadianceBatch8Test.*' --gtest_brief=1 --gtest_output=xml:results/radiance_batch8_focused_tests.xml
      - name: Strict compiled registration and catalog audit
        if: ${{ needs.preflight.outputs.mode == 'batch' || needs.preflight.outputs.mode == 'full' }}
        run: |
          mkdir -p results
          alpharune/build/riftbound --dump-registry results/radiance_batch8_registry.json
          python3 radiance/verify_batch8_registry.py results/radiance_batch8_registry.json --output results/radiance_batch8_coverage.json
          python3 radiance/audit_wave5_catalog_registry.py radiance/data/radiance_catalog.json results/radiance_batch8_registry.json > results/radiance_batch8_catalog_audit.json
          python3 radiance/coverage_ledger.py results/radiance_batch8_registry.json --output results/radiance_batch8_ledger.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path("results/radiance_batch8_catalog_audit.json").read_text())
          assert x["compiled_registry_size"]==1015
          assert x["registered_base_count"]==59
          assert x["missing_base_count"]==108
          assert x["all_mechanics_verified"] is False
          print("BATCH7_CATALOG_GATE_PASS_NOT_FULL_MECHANICS_CERTIFICATION")
          PY
      - name: Full AlphaRune regression - final batch gate only
        if: ${{ needs.preflight.outputs.mode == 'full' }}
        run: |
          RIFTBOUND_ROOT=alpharune alpharune/build/riftbound_tests --gtest_brief=1 --gtest_output=xml:results/radiance_batch8_full_regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiance-batch8-validation-${{ needs.preflight.outputs.mode }}
          path: results/
          retention-days: 30
          if-no-files-found: ignore
