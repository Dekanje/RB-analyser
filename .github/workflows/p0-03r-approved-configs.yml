name: P0-03R approved execution configurations
on:
  push:
    branches: ['feature/p0-03r-approved-configs']
    paths:
      - 'rulesets/configurations/**'
      - 'scripts/approved_format.py'
      - 'scripts/run_approved_match.py'
      - 'scripts/test_approved_format.py'
      - 'scripts/check_approved_format.py'
      - '.github/workflows/p0-03r-approved-configs.yml'
permissions:
  contents: read
  actions: read
jobs:
  configs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Targeted unit tests
        run: |
          python3 -m unittest discover -s scripts -p 'test_format_gateway.py' -v
          python3 -m unittest discover -s scripts -p 'test_format_match_v2.py' -v
          python3 -m unittest discover -s scripts -p 'test_format_roster_v2.py' -v
          python3 -m unittest discover -s scripts -p 'test_approved_format.py' -v
      - uses: actions/download-artifact@v4
        with:
          run-id: 45282108093
          github-token: ${{ github.token }}
          name: competitive-guidebot-rule407-verified-engine-binary
          path: results/p003config/engine
      - uses: actions/download-artifact@v4
        with:
          run-id: 45181493632
          github-token: ${{ github.token }}
          name: expanded-optimized-58-independent-radiance-bo3
          path: results/p003config/selected
      - uses: actions/download-artifact@v4
        with:
          run-id: 45306837115
          github-token: ${{ github.token }}
          name: p0-03r-native-receipts
          path: results/p003config/prior
      - name: Native and negative configuration controls
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libboost-context1.83.0 libboost-program-options1.83.0
          chmod +x results/p003config/engine/riftbound
          python3 scripts/check_approved_format.py --engine results/p003config/engine/riftbound --registry results/p003config/engine/registry.json --profile rulesets/standard-global-2026-11-23.json --selected results/p003config/selected/selected_decks --prior results/p003config/prior/report.json --output results/p003config/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: p0-03r-approved-configs
          path: results/p003config/report.json
          if-no-files-found: error
          retention-days: 30
