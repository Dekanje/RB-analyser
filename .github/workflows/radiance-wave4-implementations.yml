name: Radiance full-card implementation - Wave 4 C++ semantics
on:
  push:
    branches: ['radiance/full-card-implementation-wave4-2026-11-22']
    paths:
      - '.github/workflows/radiance-wave4-implementations.yml'
      - 'radiance/engine_overlay/**'
      - 'radiance/verify_wave4_registry.py'
      - 'radiance/coverage_ledger.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v4
      - name: Check Python patches and audit scripts
        run: |
          python3 -m py_compile radiance/engine_overlay/apply.py radiance/engine_overlay/wave1_regression_fix.py radiance/engine_overlay/apply_wave2.py radiance/engine_overlay/apply_wave3.py radiance/engine_overlay/apply_wave4.py radiance/verify_wave4_registry.py radiance/coverage_ledger.py
      - name: Pin AlphaRune and apply implementation Waves 1–4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ ccache libboost-all-dev nlohmann-json3-dev
          git clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
          python3 radiance/engine_overlay/apply.py
          python3 radiance/engine_overlay/wave1_regression_fix.py
          python3 radiance/engine_overlay/apply_wave2.py
          python3 radiance/engine_overlay/apply_wave3.py
          python3 radiance/engine_overlay/apply_wave4.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: radiance-wave4-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            radiance-wave3-ccache-
            radiance-wave2-ccache-
            radiance-regression-ccache-
      - name: Compile complete pinned engine and tests
        run: |
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFTBOUND_BUILD_JOBS=2 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build alpharune/build --target riftbound riftbound_tests -j 2
      - name: Run Wave 1 through 4 card-specific engine-path tests
        run: |
          mkdir -p results
          RIFTBOUND_ROOT=alpharune alpharune/build/riftbound_tests --gtest_filter='RadianceWave1Test.*:RadianceWave2Test.*:RadianceWave3Test.*:RadianceWave4Test.*' --gtest_brief=1 --gtest_output=xml:results/radiance_wave4_card_tests.xml
      - name: Run all AlphaRune regression tests, without exclusions
        run: |
          RIFTBOUND_ROOT=alpharune alpharune/build/riftbound_tests --gtest_brief=1 --gtest_output=xml:results/radiance_wave4_full_regression.xml
      - name: Require 997 definitions, nine card identities, and full coverage ledger
        run: |
          alpharune/build/riftbound --dump-registry results/radiance_wave4_registry.json
          python3 radiance/verify_wave4_registry.py results/radiance_wave4_registry.json --output results/radiance_wave4_coverage.json
          python3 radiance/coverage_ledger.py results/radiance_wave4_registry.json --output results/radiance_coverage_ledger.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radiance-wave4-997-card-coverage-and-tests
          path: results/
          retention-days: 30
          if-no-files-found: ignore
