name: Trace exact Mordekaiser crashes before Boost context failure
on:
  push:
    branches: ['repair/ismcts-stability-2026-11-21']
    paths: ['.github/workflows/ismcts-morde-trace.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: 44932743894
          github-token: ${{ github.token }}
          name: repaired-ismcts-engine-preflight
          path: .
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libboost-all-dev
          chmod +x alpharune/build/riftbound
      - name: Capture final 250 trace events before exact failures
        run: |
          python3 - <<'PY'
          import pathlib,sys,subprocess,json
          sys.path.insert(0,'scripts')
          from run_actual_games import decode
          from legal_candidate import make_legal_candidate
          decks=make_legal_candidate(decode(),pathlib.Path('decks_legal_candidate'))
          tests=[('mord_azir','Mordekaiser, Iron Revenant','Azir, Emperor of the Sands',202611556010),
             ('mord_mirror','Mordekaiser, Iron Revenant','Mordekaiser, Iron Revenant',202611556151)]
          root=pathlib.Path('results/mord_traces');root.mkdir(parents=True,exist_ok=True)
          for label,a,b,seed in tests:
           cmd=['alpharune/build/riftbound','--deck1',str(decks[a]),'--deck2',str(decks[b]),
                '--agent1','ismcts:sims=24','--agent2','ismcts:sims=24',
                '--game-mode','match','--seed',str(seed),'--web','off','--render-html','off','--trace']
           try:
            r=subprocess.run(cmd,capture_output=True,text=True,timeout=85)
            text=r.stdout+'\n[STDERR]\n'+r.stderr;rc=r.returncode
           except subprocess.TimeoutExpired as e:
            text='TIMEOUT\n'+str(e);rc='TIMEOUT'
           (root/(label+'.txt')).write_text(text,encoding='utf8')
           lines=text.splitlines()
           print('LAST_ENGINE_EVENTS',label,'rc',rc,'bytes',len(text),
                 '\n'.join(lines[-250:])[-22000:],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-ismcts-mordekaiser-trace-context
          path: results/mord_traces/
          if-no-files-found: ignore
          retention-days: 30
