name: Competitive RAD-057 Guidebot repaired native 407 full C++ and exact failure regression
on:
  push:
    branches: ['research/competitive-agent-benchmark-v1-2026-11-23']
    paths:
      - '.github/workflows/competitive-guidebot-native-qa.yml'
      - 'radiance/engine_overlay/tournament_starting_player.py'
      - 'scripts/tournament_bo3_policy.py'
      - 'scripts/test_tournament_bo3_policy.py'
      - 'scripts/optimize_58.py'
permissions:
  contents: read
  actions: read
jobs:
  construct-sideboard-provenance-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate Python rules, 407 seat mapping and fail-closed receipts
        run: |
          set -euo pipefail
          python3 -m py_compile radiance/engine_overlay/tournament_starting_player.py scripts/optimize_58.py scripts/tournament_bo3_policy.py scripts/test_tournament_bo3_policy.py
          python3 -m unittest discover -s scripts -p 'test_tournament_bo3_policy.py' -v
  compile-407-and-test-entire-engine:
    needs: construct-sideboard-provenance-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned AlphaRune C++ compilation dependencies
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if ! sudo env DEBIAN_FRONTEND=noninteractive timeout -k 10s 65s apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12 update -qq; then
            echo '::warning::using cached package indexes'
          fi
          sudo env DEBIAN_FRONTEND=noninteractive timeout 420s apt-get -o DPkg::Lock::Timeout=30 -o Acquire::Retries=2 install -y -qq --no-install-recommends ccache libboost-program-options-dev libboost-filesystem-dev libboost-system-dev libboost-context-dev nlohmann-json3-dev
          timeout 120s git -c http.lowSpeedLimit=1024 -c http.lowSpeedTime=30 clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
      - name: Apply all 167 Radiance definitions, repaired semantics and actual first-player control
        run: |
          set -euo pipefail
          python3 radiance/engine_overlay/apply.py
          python3 radiance/engine_overlay/wave1_regression_fix.py
          python3 radiance/engine_overlay/apply_wave2.py
          python3 radiance/engine_overlay/apply_wave3.py
          python3 radiance/engine_overlay/apply_wave4.py
          python3 radiance/engine_overlay/apply_batch6.py
          python3 radiance/engine_overlay/apply_batch7.py
          python3 radiance/engine_overlay/apply_batch8.py
          python3 radiance/engine_overlay/apply_batch9.py
          python3 radiance/engine_overlay/apply_batch9_battlefields.py
          python3 radiance/engine_overlay/apply_batch9_disarm_chain.py
          python3 radiance/engine_overlay/apply_batch10.py
          python3 radiance/engine_overlay/apply_final64.py
          python3 radiance/engine_overlay/stability_patch.py
          python3 radiance/engine_overlay/fullfield_repair.py
          python3 radiance/engine_overlay/tournament_starting_player.py
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: competitive-407-pch-gcc13-${{ github.sha }}
          restore-keys: |
            rad64-pch-safe-linux-gcc13-
      - name: Compile actual matching ISMCTS and all C++ tests
        timeout-minutes: 53
        run: |
          set -euo pipefail
          ccache -M 3G
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFTBOUND_BUILD_JOBS=3 "-DCMAKE_CXX_COMPILER_LAUNCHER=env;CCACHE_SLOPPINESS=pch_defines,time_macros;$PWD/alpharune/scripts/ccache_pch_safe.sh"
          cmake --build alpharune/build --target riftbound riftbound_tests -j 3
          mkdir -p results/rule407 engine_build
          cp alpharune/build/riftbound engine_build/riftbound
          alpharune/build/riftbound --dump-registry engine_build/registry.json
          python3 radiance/verify_final64_registry.py engine_build/registry.json --output results/rule407/coverage.json
      - name: Full repaired AlphaRune C++ regression with starting-player change
        timeout-minutes: 17
        run: |
          set -euo pipefail
          RIFTBOUND_ROOT=alpharune alpharune/build/riftbound_tests --gtest_brief=1 --gtest_output=xml:results/rule407/all_tests.xml
          python3 - <<'PY'
          import json,xml.etree.ElementTree as E
          from pathlib import Path
          doc=E.parse('results/rule407/all_tests.xml').getroot()
          counts={key:int(doc.attrib.get(key,0)) for key in ('tests','failures','errors','disabled')}
          assert counts['tests']>=3900 and counts['failures']==0 and counts['errors']==0
          Path('results/rule407/test_counts.json').write_text(json.dumps(counts,indent=2))
          print('RULE407_ALL_CPP_TESTS_PASS',counts)
          PY
          python3 radiance/verify_final64_registry.py engine_build/registry.json --mechanics-xml results/rule407/all_tests.xml
      - uses: actions/download-artifact@v4
        with:
          run-id: 45181493632
          github-token: ${{ github.token }}
          name: expanded-optimized-58-independent-radiance-bo3
          path: results/selected
      - name: Real engine BO3 with actual 407 loser-forced turn and sideboarding
        timeout-minutes: 12
        run: |
          set -euo pipefail
          python3 -u scripts/tournament_bo3_policy.py \
            --engine engine_build/riftbound \
            --registry engine_build/registry.json \
            --deck1 results/selected/selected_decks/draven_glorious_executioner.txt \
            --deck2 results/selected/selected_decks/leblanc_deceiver.txt \
            --policy data/competitive_sideboard_smoke_2026-11-23.json \
            --agent ismcts:sims=24 --timeout 180 --seed 202611240477 \
            --output results/rule407/sideboard_407_real_bo3.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/rule407/sideboard_407_real_bo3.json').read_text())
          assert d['status']=='COMPLETE_RULE407_START_POLICY_BO3'
          assert d['rule_407_4_start_choice_verified'] is True
          assert d['sideboarding_applied'] is True
          assert len(d['games'])>=2
          assert all(g['engine_status']=='complete' for g in d['games'])
          assert all(g['verified_engine_starting_seat']==g['expected_engine_starting_seat'] for g in d['games'][1:])
          assert d['games'][1]['loser_chose']=='self'
          print('RULE407_REAL_BO3_ISMCTS_PASS',len(d['games']),d['score'])
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 45259246337
          github-token: ${{ github.token }}
          name: worlds-all58-registered-structure-legal-unvalidated-variants
          path: results/structure
      - name: Exact Nasus Piltovan Guidebot versus RekSai native Game 3 regression
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          from sideboard_deck import parse_deck,render_deck
          from tournament_bo3_policy import transition
          from optimize_58 import registry
          candidate=Path('results/structure/nasus_curator_of_the_sands/structural_008.txt')
          assert hashlib.sha256(candidate.read_bytes()).hexdigest()=='42faef389e09f80b3a1eb474106da70cab388552cfef2c944e2909471491b163'
          state=parse_deck(candidate.read_text())
          amended=transition(state,{'swaps':[{'main_out':'Bellows Breath','side_in':'Piltovan Guidebot','copies':1}]},registry(Path('engine_build/registry.json')),game_no=3)
          p=Path('results/rule407/guidebot_nasus_game3.txt')
          p.write_text(render_deck(amended))
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest=='bffdf8134695f5b7fdf7bffc95c7b42c2cbd57278f17a157d7552912477fab0f',digest
          opponent=Path('results/selected/selected_decks/rek_sai_void_burrower.txt')
          assert hashlib.sha256(opponent.read_bytes()).hexdigest()=='a2b11056350d63fca0bcd7783319aa2d34a6f0f305598e7cb567e66e465aa9f6'
          print('EXACT_SOURCE_NATIVE_GUIDEBOT_407_REPLAY_SHA_PASS')
          PY
          timeout -k 10s 460s env RIFTBOUND_FORCE_STARTING_PLAYER=1 \
            engine_build/riftbound \
            --deck1 results/rule407/guidebot_nasus_game3.txt \
            --deck2 results/selected/selected_decks/rek_sai_void_burrower.txt \
            --agent1 ismcts:sims=24 --agent2 ismcts:sims=24 \
            --game-mode match --seed 637055508 --web off --render-html off \
            > results/rule407/guidebot_exact_seed.log 2>&1 || {
              tail -n 200 results/rule407/guidebot_exact_seed.log
              exit 1
            }
          grep -F 'TOURNAMENT_FORCED_STARTING_PLAYER=1' results/rule407/guidebot_exact_seed.log
          grep -E 'Game over: winner=[12]' results/rule407/guidebot_exact_seed.log
          echo 'PILTOVAN_GUIDEBOT_EXACT_CRASH_SEED_REPAIRED_AND_COMPLETED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competitive-guidebot-rule407-compiled-qa-evidence
          path: results/rule407/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: competitive-guidebot-rule407-verified-engine-binary
          path: |
            engine_build/riftbound
            engine_build/registry.json
          retention-days: 30
