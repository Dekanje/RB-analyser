name: Audit missing Radiance C++ card implementations for original nine decks
on:
  push:
    paths:
      - 'radiance/extract_missing_rules.py'
      - '.github/workflows/radiance-nine-source-audit.yml'
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Get Riot card gallery snapshot from pinned open-source reader
        run: |
          git clone --quiet https://github.com/Dystorted888/riftbound-card-data.git gallery-data
          git -C gallery-data checkout --quiet --detach 8a10812968506363a373f36a8bb7cf4d94d02694
      - name: Get pinned AlphaRune C++ engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ libboost-all-dev nlohmann-json3-dev
          git clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
      - name: Restore cached engine
        id: cache
        uses: actions/cache@v4
        with:
          path: alpharune/build/riftbound
          key: alpharune-ubuntu2404-ec90f0f-release-v1
      - name: Build if missing
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFTBOUND_BUILD_JOBS=2
          cmake --build alpharune/build --target riftbound -j 2
      - name: Export compiled engine registry
        run: |
          mkdir -p radiance_reports
          alpharune/build/riftbound --dump-registry radiance_reports/compiled_engine_registry.json
      - name: Identify full source text for cards absent from 9 original decks
        run: python3 radiance/extract_missing_rules.py
      - name: Upload exact blocked-card report and mechanics for implementation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nine-radiance-original-deck-mechanics-audit
          path: radiance_implementation_reports/
          retention-days: 7
          if-no-files-found: warn
