name: Regression-test repaired ISMCTS engine mechanics
on:
  push:
    branches: ['repair/ismcts-stability-2026-11-21']
    paths:
      - '.github/workflows/ismcts-stability-regression.yml'
      - 'radiance/engine_overlay/stability_patch.py'
      - 'radiance/engine_overlay/source/cards/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Build exact pinned engine plus repair overlay
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++ ccache libboost-all-dev nlohmann-json3-dev
          git clone --quiet https://github.com/chorlick/alpharune.git alpharune
          git -C alpharune checkout --quiet --detach ec90f0fed002aed374d06249fa95e83e3cfbd386
          python3 radiance/engine_overlay/apply.py
          python3 radiance/engine_overlay/stability_patch.py
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: repair-regression-ubuntu2404-${{ github.sha }}
          restore-keys: |
            radiance-regression-ccache-ubuntu2404-
            ismcts-debug-ccache-ubuntu2404-
            radiance-ccache-ubuntu2404-
      - name: Compile full regression suite
        run: |
          cmake -S alpharune -B alpharune/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRIFTBOUND_BUILD_JOBS=2 -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build alpharune/build --target riftbound_tests -j 2
      - name: Run the real C++ tests, no exclusions beyond upstream
        run: |
          mkdir -p results
          RIFTBOUND_ROOT=alpharune alpharune/build/riftbound_tests --gtest_brief=1 --gtest_output=xml:results/ismcts_stability_regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-engine-cpp-regression
          path: results/ismcts_stability_regression.xml
          if-no-files-found: ignore
          retention-days: 30
